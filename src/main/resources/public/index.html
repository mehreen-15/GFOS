<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Cafeteria System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    .menu-card {
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .cart-badge {
      animation: pulse 0.3s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .order-status-pending { background: #FEF3C7; color: #92400E; }
    .order-status-preparing { background: #DBEAFE; color: #1E40AF; }
    .order-status-ready { background: #D1FAE5; color: #065F46; }
    .order-status-completed { background: #E5E7EB; color: #374151; }
    .order-status-cancelled { background: #FEE2E2; color: #991B1B; }

    .loading-spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .tab-active {
      border-bottom: 3px solid #2563eb;
      color: #2563eb;
      font-weight: 600;
    }

    .quantity-input {
      -moz-appearance: textfield;
    }

    .quantity-input::-webkit-outer-spin-button,
    .quantity-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
</head>
<body class="h-full">
  <div id="app" class="w-full h-full overflow-auto"></div>
  <script src="/app.js"></script>
</body>
</html>
